<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vibe Check – Set 4 (Profiles 21–30)</title>
  <style>
    :root { --bg:#0f172a; --panel:#111827; --ink:#e5e7eb; --muted:#9ca3af; --chip:#1f2937; --green:#10b981; --yellow:#f59e0b; --red:#ef4444; --card:#0b1220; --shadow:rgba(0,0,0,.45); --radius:16px; }
    *{box-sizing:border-box} html,body{height:100%}
    body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Inter,Helvetica,Arial; background:radial-gradient(1200px 800px at 80% -10%, #0b1220 0%, var(--bg) 65%); color:var(--ink)}
    .wrap{max-width:1100px;margin:0 auto;padding:24px}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px}
    .title{font-weight:800}.title .kicker{display:block;font-weight:600;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px}
    .title .main{font-size:clamp(22px,3.4vw,34px)}
    .controls{display:flex;gap:10px;flex-wrap:wrap}
    button{background:#1f2937;color:var(--ink);border:1px solid #263244;padding:10px 14px;border-radius:12px;cursor:pointer;font-weight:600}
    .grid{display:grid;grid-template-columns:420px 1fr;gap:18px} @media (max-width:980px){.grid{grid-template-columns:1fr}}
    .leftcol{display:flex;flex-direction:column;gap:10px}
    .card{background:#0d1527;border:1px solid #1f2a3a;border-radius:var(--radius);box-shadow:0 20px 50px var(--shadow);overflow:hidden}
    .imagebox{position:relative;aspect-ratio:4/5;background:#0b1020}
    .imagebox img{width:100%;height:100%;object-fit:cover}
    .badge{position:absolute;top:12px;left:12px;background:#0f172a;border:1px solid #223048;padding:6px 10px;border-radius:999px;font-size:12px;color:var(--muted)}
    .panel{padding:18px}.handle{font-size:22px;font-weight:800}.meta{color:var(--muted);font-size:14px}
    .bio{margin:12px 0 14px;color:#d1d5db;line-height:1.55}
    .chips{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
    .chip{background:#1f2937;border:1px solid #243042;border-radius:999px;padding:6px 10px;font-size:12px;color:#cbd5e1}
    .flags,.prompts,.interests{background:#0c1425;border:1px solid #1a2536;padding:14px;border-radius:14px}
    .section-title{font-weight:700;font-size:13px;color:var(--muted);text-transform:uppercase;margin-bottom:8px;letter-spacing:.4px}
    .flag-green{color:var(--green)} .flag-yellow{color:var(--yellow)} .flag-red{color:var(--red)}
    .logo-under-pic img{display:block;width:100%;height:auto;border-radius:12px;border:1px solid #223048;box-shadow:0 8px 30px rgba(0,0,0,.35)}
    footer{margin-top:18px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
    .kbd{background:#0b1424;border:1px solid #1a2638;padding:2px 6px;border-radius:6px;font-family:ui-monospace,Menlo,Consolas,monospace;color:#cbd5e1}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title">
        <span class="kicker">Vibe Check Game</span>
        <span class="main">Vibe Check – Set 4 (Profiles 21–30)</span>
      </div>
      <div class="controls">
        <button id="prevBtn">◀ Prev</button>
        <button id="randomBtn">🔀 Random</button>
        <button id="nextBtn">Next ▶</button>
      </div>
    </header>
    <main class="grid">
      <section class="leftcol">
        <div class="card imagebox">
          <img id="profileImg" alt="Profile image" />
          <div class="badge" id="badge">#21</div>
        </div>
        <div class="logo-under-pic">
          <img
            src="images/vibecheck-strip-420.png"
            srcset="images/vibecheck-strip-320.png 320w, images/vibecheck-strip-420.png 420w, images/vibecheck-strip-640.png 640w"
            sizes="(max-width:980px) 100vw, 420px"
            alt="Vibe Check"
          />
        </div>
      </section>
      <section>
        <div class="card panel">
          <div class="handle" id="handle">Profile Name</div>
          <div class="meta" id="meta">F, 30</div>
          <p class="bio" id="bio"></p>
          <div class="chips" id="chips"></div>
          <div class="interests">
            <div class="section-title">Interests</div>
            <ul id="interests"></ul>
          </div>
        </div>
        <div class="card panel">
          <div class="flags">
            <div class="section-title">Flag Analysis</div>
            <ul id="flags"></ul>
          </div>
        </div>
        <div class="card panel">
          <div class="prompts">
            <div class="section-title">Reflection Prompts</div>
            <ul id="prompts"></ul>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <div>Use <span class="kbd">←</span>/<span class="kbd">→</span> keys</div>
      <div id="counter">1 / 10</div>
    </footer>
  </div>
  <script>
    const PROFILES = [
      { id:21, handle:"OpinionatedOscar", gender:"M", age:37,
        bio:"I’ll tell you what I think—about everything. Politics, movies, what you’re wearing. I call it passion; you might call it a lot. I just want someone who can keep up with the debate.",
        interests:["Op-eds","think pieces","group chats where he always has the last word","hot takes","documentaries"],
        flags:{ green:["Passionate","intellectually engaged","assertive"], yellow:["May dominate conversations"], red:["May confuse strong opinions with emotional intelligence"]},
        prompts:["When does confidence turn into control?","Can space for disagreement also be space for respect?","What happens when curiosity is missing from communication?"],
        image:"images/opinionatedoscar.png"
      },
      { id:22, handle:"CrystalClearCasey", gender:"F", age:30,
        bio:"I speak in affirmations and cleanse my space weekly. I’ve healed from my last 5 lives. If you’re not energetically aligned, I’ll know in the first five minutes—and my aura reader will back me up.",
        interests:["Chakra meditations","full moon rituals","crystal grids","vision boards","Reiki"],
        flags:{ green:["Intuitive","mindful","self-reflective"], yellow:["May avoid practical conflict resolution"], red:["May lean into magical thinking as emotional avoidance"]},
        prompts:["When is intuition helpful—and when is it projection?","Can spiritual alignment exist alongside emotional discomfort?","What happens when boundaries are guided only by ‘vibes’?"],
        image:"images/crystalclearcasey.png"
      },
      { id:23, handle:"HustleHardHarper", gender:"F", age:32,
        bio:"I’m building my brand, my empire, and my schedule doesn’t include small talk. I like my coffee bold and my relationships low-maintenance. I’ll make time—but you better bring purpose.",
        interests:["Branding","business podcasts","hustle culture","power naps","group coaching"],
        flags:{ green:["Driven","focused","empowered"], yellow:["May struggle to slow down emotionally"], red:["May deprioritize connection for productivity"]},
        prompts:["Can ambition and intimacy grow side-by-side?","When does self-sufficiency become self-protection?","What does ‘making time’ for people mean to you?"],
        image:"images/hustlehardharper.png"
      },
      { id:24, handle:"GhostHunterGavin", gender:"M", age:35,
        bio:"I swear I’m not afraid of commitment—I’m just hard to find when things get real. I’ll disappear mid-text, mid-plan, or mid-date. It’s not personal, it’s pattern.",
        interests:["Horror flicks","paranormal TikTok","urban legends","disappearing acts"],
        flags:{ green:["Playful","mysterious","engaging"], yellow:["Avoids accountability or presence"], red:["Ghosting as default conflict style"]},
        prompts:["How do you respond to inconsistent availability?","What needs drive ghosting behavior?","Can safety be built with someone always half-present?"],
        image:"images/ghosthuntergavin.png"
      },
      { id:25, handle:"RescueProjectRiley", gender:"F", age:31,
        bio:"I fall for potential. If you’re emotionally unavailable or deeply wounded, I’m your girl. I’ll help you heal—then wonder why I’m exhausted.",
        interests:["Trauma bonding TikToks","DIY therapy kits","Pinterest boards for people she’s dating","messy art journaling"],
        flags:{ green:["Empathetic","nurturing","emotionally open"], yellow:["Tendency to take on fixer roles"], red:["May neglect self in service of rescuing others"]},
        prompts:["What’s the difference between support and self-sacrifice?","When does ‘helping’ reinforce a pattern?","What would it feel like to be loved without needing to be saved?"],
        image:"images/rescueprojectriley.png"
      },
      { id:26, handle:"ConvoMonologConnor", gender:"M", age:34,
        bio:"I’ve always got a story to tell—and then one more. I mean well, but I might accidentally turn your five-minute check-in into a TED Talk. Listening is something I’m still working on.",
        interests:["Podcasts (his own)","long voice notes","being the center of attention","‘funny you should ask…’"],
        flags:{ green:["Outgoing","engaging","great storyteller"], yellow:["May struggle with reciprocal communication"], red:["May dominate conversations and unintentionally disregard others’ voices"]},
        prompts:["What’s the difference between being heard and feeling heard?","Can someone talk a lot and still leave space for others?","When do stories bring people together—and when do they overshadow connection?"],
        image:"images/convomonologconnor.png"
      },
      { id:27, handle:"ChillUntilTriggeredTrina", gender:"F", age:33,
        bio:"I’m laid back, go-with-the-flow… until I feel cornered. Then it’s sharp words and cold silence. I’m working on regulation—but don’t test me.",
        interests:["Bubble baths","silent treatments","TikTok drama","yoga memes","reading your energy"],
        flags:{ green:["Relaxed","introspective","independent"], yellow:["Avoidant conflict style"], red:["May rely on emotional shutdowns or passive aggression in conflict"]},
        prompts:["What does healthy conflict look like to you?","How do we recognize when calmness is masking reactivity?","When is silence protective—and when is it punishing?"],
        image:"images/chilluntiltriggeredtrina.png"
      },
      { id:28, handle:"ValidationVacationVic", gender:"M", age:28,
        bio:"Tell me I’m amazing. Again. No seriously—again. I love attention, reassurance, and being liked… maybe a little too much. I’m fun at parties and anxious afterward.",
        interests:["Mirror selfies","group hangovers","chasing compliments","spiral texting after being left on read"],
        flags:{ green:["Energetic","friendly","emotionally expressive"], yellow:["High reassurance needs"], red:["May become emotionally dependent on external validation"]},
        prompts:["What happens when self-worth hinges on others?","Can validation be healthy in moderation?","How do we build internal stability in a like-driven world?"],
        image:"images/validationvacationvic.png"
      },
      { id:29, handle:"MicroStepMaya", gender:"F", age:30,
        bio:"I’m trying. Therapy. Journaling. Saying no (sometimes). I may take a while to open up, but every step matters to me—even the small ones you don’t see.",
        interests:["Healing playlists","quiet wins","post-it goals","growth charts","slow mornings"],
        flags:{ green:["Committed to growth","self-aware","humble"], yellow:["May struggle with vulnerability"], red:["May withdraw or self-sabotage when overwhelmed"]},
        prompts:["How do we support someone pacing their growth?","Can small steps build deep trust?","What does it look like to celebrate progress over perfection?"],
        image:"images/microstepmaya.png"
      },
      { id:30, handle:"TMITravis", gender:"M", age:31,
        bio:"You’ll know everything about me by the second date—childhood wounds, medical history, that one time I cried during ‘Finding Nemo.’ I overshare so you don’t ask the hard questions later.",
        interests:["Trauma dumps","3 a.m. text walls","DM confessions","vulnerability as a first impression"],
        flags:{ green:["Open","emotionally available","sincere"], yellow:["Lacks pacing or boundaries"], red:["May use over-disclosure to bypass real emotional intimacy"]},
        prompts:["Is sharing vulnerability the same as building connection?","When is openness helpful—and when is it overwhelming?","What does intentional pacing look like in emotional safety?"],
        image:"images/tmitravis.png"
      }
    ];

    let index = 0;
    const imgEl = document.getElementById('profileImg');
    const badgeEl = document.getElementById('badge');
    const handleEl = document.getElementById('handle');
    const metaEl = document.getElementById('meta');
    const bioEl = document.getElementById('bio');
    const chipsEl = document.getElementById('chips');
    const interestsEl = document.getElementById('interests');
    const flagsEl = document.getElementById('flags');
    const promptsEl = document.getElementById('prompts');
    const counterEl = document.getElementById('counter');

    function render(i) {
      const p = PROFILES[i];
      if (!p) return;
      index = i;
      imgEl.src = p.image;
      imgEl.alt = p.handle + " image";
      badgeEl.textContent = "#" + p.id;
      handleEl.textContent = p.handle;
      metaEl.textContent = p.gender + ", " + p.age;
      bioEl.textContent = p.bio;

      chipsEl.innerHTML = "";
      ["Green","Yellow","Red"].forEach(label => {
        const span = document.createElement('span');
        span.className = "chip";
        span.textContent = label + " Flags";
        chipsEl.appendChild(span);
      });

      interestsEl.innerHTML = (p.interests||[]).map(x => "<li>"+x+"</li>").join("");

      const fl = [];
      (p.flags.green||[]).forEach(g => fl.push("<li class='flag-green'>✅ Green Flag: "+g+"</li>"));
      (p.flags.yellow||[]).forEach(y => fl.push("<li class='flag-yellow'>⚠️ Yellow Flag: "+y+"</li>"));
      (p.flags.red||[]).forEach(r => fl.push("<li class='flag-red'>🚩 Red Flag: "+r+"</li>"));
      flagsEl.innerHTML = fl.join("");

      promptsEl.innerHTML = (p.prompts||[]).map(x => "<li>"+x+"</li>").join("");

      counterEl.textContent = (i+1) + " / " + PROFILES.length;
    }

    document.getElementById('prevBtn').addEventListener('click', () => render((index - 1 + PROFILES.length) % PROFILES.length));
    document.getElementById('nextBtn').addEventListener('click', () => render((index + 1) % PROFILES.length));
    document.getElementById('randomBtn').addEventListener('click', () => render(Math.floor(Math.random() * PROFILES.length)));

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') render((index - 1 + PROFILES.length) % PROFILES.length);
      if (e.key === 'ArrowRight') render((index + 1) % PROFILES.length);
    });

    render(0);
  </script>
</body>
</html>
