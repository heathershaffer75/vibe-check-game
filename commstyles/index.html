<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vibe Check: Communication Styles</title>
<style>
  :root{
    --bg:#0f172a; /* slate-900 */
    --card:#111827; /* gray-900 */
    --muted:#94a3b8; /* slate-400 */
    --text:#e5e7eb; /* gray-200 */
    --accent:#22d3ee; /* cyan-400 */
    --red:#ef4444;
    --yellow:#f59e0b;
    --green:#10b981;
    --blue:#60a5fa;
    --shadow:0 10px 25px rgba(0,0,0,.35);
    --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    background: radial-gradient(1200px 800px at 10% -5%, #1e293b 0%, #0b1020 45%, #070b16 100%);
    color:var(--text);
    line-height:1.55;
  }
  a{color:var(--accent); text-decoration:none}
  .wrap{
    max-width:1100px;
    margin:0 auto;
    padding:28px 16px 80px;
  }
  header{
    display:flex; gap:16px; align-items:center; margin-bottom:20px;
  }
  .logo{
    width:56px; height:56px; border-radius:14px;
    background:linear-gradient(135deg, #22d3ee, #60a5fa);
    display:grid; place-items:center; color:#07121e; font-weight:900;
    box-shadow:var(--shadow);
  }
  h1{margin:0; font-size:28px; letter-spacing:.3px}
  h2{
    font-size:18px; margin:6px 0 0; color:var(--muted); font-weight:500;
  }
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(300px,1fr));
    gap:18px;
  }
  .card{
    background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.0));
    border:1px solid rgba(255,255,255,.07);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow:hidden;
    display:flex; flex-direction:column;
  }
  .imgbox{
    aspect-ratio: 16/10;
    background:#0b1224;
    display:grid; place-items:center; position:relative;
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .imgbox img{width:100%; height:100%; object-fit:cover; display:block}
  .ph{transition:opacity .25s ease, visibility .25s ease;
    position:absolute; inset:0; display:grid; place-items:center;
    color:var(--muted); font-size:14px; letter-spacing:.3px; padding:10px; text-align:center;
  }
  .content{padding:14px 14px 6px}
  .name{font-weight:800; font-size:18px; margin-bottom:2px}
  .tag{color:var(--muted); font-size:13px; margin-bottom:10px}
  .desc{font-size:14px; color:#dbe5ff; opacity:.9; margin-bottom:10px}
  .flags{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px}
  button.flag{
    appearance:none; border:none; cursor:pointer;
    padding:8px 10px; border-radius:999px; font-weight:700; font-size:12px;
    letter-spacing:.3px; color:#0a0f1e; box-shadow: inset 0 -2px rgba(0,0,0,.25);
  }
  .f-red{background:var(--red)}
  .f-yellow{background:var(--yellow)}
  .f-green{background:var(--green)}
  .f-blue{background:var(--blue)}
  details{
    background:rgba(255,255,255,.02);
    border:1px solid rgba(255,255,255,.06);
    border-radius:14px;
    margin:10px 0 12px; padding:10px 12px;
  }
  summary{cursor:pointer; font-weight:800; color:#cbd5e1}
  .meta{display:grid; grid-template-columns: 1fr; gap:6px; margin-top:8px}
  .row b{display:block; font-size:12px; text-transform:uppercase; letter-spacing:.3px; color:#cbd5e1; opacity:.9}
  .row p{margin:2px 0 0; font-size:14px; color:#e5e7eb}
  .scenario{
    margin-top:28px;
    background:linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.02));
    border:1px solid rgba(255,255,255,.08);
    padding:18px; border-radius:var(--radius);
    box-shadow: var(--shadow);
  }
  .scenario h3{margin:0 0 10px}
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{
    border:1px solid rgba(255,255,255,.14); border-radius:999px; padding:8px 10px;
    font-size:13px; color:#dbeafe; background:rgba(99,102,241,.08); cursor:pointer;
  }
  .drawer{
    margin-top:12px; padding:12px; border-radius:12px;
    border:1px dashed rgba(255,255,255,.15); color:#d1fae5; display:none;
  }
  .controls{display:flex; gap:8px; margin:12px 0}
  .btn{
    appearance:none; border:1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.04);
    color:var(--text); padding:10px 12px; border-radius:12px; cursor:pointer;
    font-weight:700; letter-spacing:.3px;
  }
  .btn:active{transform:translateY(1px)}
  footer{margin-top:22px; color:var(--muted); font-size:12px}
  .ph.hide{opacity:0; visibility:hidden}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">VC</div>
      <div>
        <h1>Vibe Check: Communication Styles</h1>
        <h2>Red / Yellow / Green flags + “Why It Matters” • Scenario Bank for live prompts</h2>
      </div>
    </header>

    <section class="grid" id="grid">
      <!-- Cards inject here -->
    </section>

    <section class="scenario" id="scen">
      <h3>Scenario Bank</h3>
      <div class="controls">
        <button class="btn" id="draw">Draw Random Scenario</button>
        <button class="btn" id="clear">Clear</button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="drawer" id="drawer"></div>
      <footer>Tip: Have pairs roleplay the moment. Group raises Red/Yellow/Green cards, then brainstorms one repair per Red.</footer>
    </section>
  </div>

<script>
/* ---------- Data ---------- */
const profiles = [
  {
    id:"rapidfireriley", name:"RapidFireRiley (F, 28)", tagline:"“Text now, talk later.”",
    img:"./images/rapidfireriley.png",
    desc:"Riley loves the buzz of constant contact. She sends dozens of short texts and feels uneasy if she doesn’t hear back quickly.",
    flags:{
      red:"Overwhelms partners with nonstop messages; reacts to pauses with anxiety.",
      yellow:"Struggles to respect different texting rhythms.",
      green:"High-energy, transparent, keeps communication flowing.",
      why:"Responsiveness isn’t the same as reliability. Trust means handling both presence and absence."
    },
    expanded:{
      attachment:"Anxious-leaning — equates responsiveness with security.",
      style:"Prefers many short texts; avoids deep or delayed conversations.",
      conflict:"Panics when left on read; may escalate with repeated calls or guilt-texts.",
      growth:"Learn that “no reply yet” ≠ abandonment; practice self-soothing during pauses.",
      repair:"Set clear expectations: “I might not reply until after work, but I’ll text when I’m free.”",
      scenario:"Riley texts every 10 minutes while partner is in a meeting.",
      discussion:[
        "What’s the upside of Riley’s style? What’s the cost?",
        "Who relates to the anxiety behind silence?",
        "How might this show up with sponsors/family/peers in recovery?"
      ]
    }
  },
  {
    id:"draftboxdan", name:"DraftBoxDan (M, 34)", tagline:"“Let me think about it…”",
    img:"./images/draftboxdan.png",
    desc:"Dan writes long, thoughtful replies—eventually. He means well but time slips away.",
    flags:{
      red:"Leaves people hanging and heightens uncertainty.",
      yellow:"Good intentions, poor time awareness.",
      green:"Deep, meaningful responses when ready.",
      why:"Pacing needs alignment; thoughtfulness lands best when it’s timely."
    },
    expanded:{
      attachment:"Avoidant-leaning — needs space to think before connecting.",
      style:"Composes essays; delays sending until it feels ‘perfect’.",
      conflict:"Goes silent during overwhelm; can look like ghosting.",
      growth:"Balance thoughtfulness with a quick acknowledgment.",
      repair:"Send: “Need time to respond—will text tonight.”",
      scenario:"Partner asks a simple question; reply arrives a day later.",
      discussion:[
        "What feelings come up when replies take a long time?",
        "How can acknowledgement texts reduce spiral thoughts?"
      ]
    }
  },
  {
    id:"emojialla", name:"EmojiElla (F, 26)", tagline:"“Why type when 😂🔥👏 will do?”",
    img:"./images/emojialla.png",
    desc:"Ella communicates with emojis, gifs, and memes. Playful, but depth can get lost.",
    flags:{
      red:"Avoids direct talk in serious moments.",
      yellow:"Tone can be misread; jokes during tender topics.",
      green:"Keeps energy light and engaging.",
      why:"Humor needs clarity too; play + plain words = fewer ruptures."
    },
    expanded:{
      attachment:"Anxious-avoidant mix — connection through play, distance from heaviness.",
      style:"Visual/light replies; avoids long text.",
      conflict:"Deflects with jokes when emotions rise.",
      growth:"Pair emojis with one sentence of intent/validation.",
      repair:"Use a ‘serious mode’ line: “Jokes aside—here’s what I mean…”",
      scenario:"You share grief; reply is three laughing emojis.",
      discussion:[
        "When does humor soothe vs. dismiss?",
        "What one-line add-on could make her reply feel safer?"
      ]
    }
  },
  {
    id:"voicenotevictor", name:"VoiceNoteVictor (M, 31)", tagline:"“Say it, don’t spray it.”",
    img:"./images/voicenotevictor.png",
    desc:"Victor prefers voice notes to capture tone and warmth. Not everyone loves listening back.",
    flags:{
      red:"Hard to reference later; can feel one-sided.",
      yellow:"Expects others to match his medium.",
      green:"Reduces misunderstandings via tone.",
      why:"Medium must feel mutual; offer choices."
    },
    expanded:{
      attachment:"Secure-leaning — seeks connection with tone and nuance.",
      style:"Short voice clips instead of typing.",
      conflict:"Frustrated if others won’t respond in kind.",
      growth:"Respect different mediums; don’t push.",
      repair:"Add a 1–2 line typed summary with each note.",
      scenario:"Sends 3-min note instead of a quick “ok”.",
      discussion:[
        "Where does tone help? Where is text better?",
        "How could summaries increase accessibility?"
      ]
    }
  },
  {
    id:"scenesettersam", name:"SceneSetterSam (F, 36)", tagline:"“Can we talk in person?”",
    img:"./images/scenesettersam.png",
    desc:"Sam prefers phone or face-to-face over screens. Presence matters—sometimes too much.",
    flags:{
      red:"Dismisses digital contact as ‘less real’.",
      yellow:"Can feel rigid about formats.",
      green:"Grounded, attuned, values depth.",
      why:"Flexibility prevents logistical conflict."
    },
    expanded:{
      attachment:"Secure with a streak of control — quality over quantity.",
      style:"Prefers calls/IRL; avoids text threads.",
      conflict:"Pushes for calls at bad times; misunderstanding schedules.",
      growth:"Expand tolerance for short, timely texts.",
      repair:"Ask which medium works when; agree on windows.",
      scenario:"Insists on calling while partner is at work.",
      discussion:[
        "When is voice best vs. text best?",
        "How can structure protect both needs?"
      ]
    }
  },
  {
    id:"paragraphpat", name:"ParagraphPat (M, 29)", tagline:"“Brevity is not my thing.”",
    img:"./images/paragraphpat.png",
    desc:"Pat answers everything with an essay. Intent is care; impact can be overwhelm.",
    flags:{
      red:"Floods with detail; partners tune out.",
      yellow:"Misses the moment while crafting the ‘right’ message.",
      green:"Thorough, thoughtful, reflective.",
      why:"Match length to the moment so care can land."
    },
    expanded:{
      attachment:"Anxious-preoccupied — seeks safety via over-explaining.",
      style:"Multi-paragraph messages for simple prompts.",
      conflict:"Info-dumps when stressed.",
      growth:"Ask preference: “Short or long version?”",
      repair:"Lead with a one-liner, then details if invited.",
      scenario:"Reply to “What’s up?” is 900 words.",
      discussion:[
        "When does detail help vs. hinder?",
        "What’s a one-line version of care here?"
      ]
    }
  },
  {
    id:"onewordwanda", name:"OneWordWanda (F, 33)", tagline:"“K.”",
    img:"./images/onewordwanda.png",
    desc:"Wanda keeps it minimal. Efficient, but emotional cues go missing.",
    flags:{
      red:"Looks cold or dismissive during tender talks.",
      yellow:"Shuts down under tension.",
      green:"Clear, concise, low-drama.",
      why:"Brevity needs reassurance words in close relationships."
    },
    expanded:{
      attachment:"Avoidant — closeness triggers short replies.",
      style:"One-word answers; rarely elaborates.",
      conflict:"Withdraws instead of clarifying.",
      growth:"Add 3–5 reassurance words (“I care, will reply later”).",
      repair:"Acknowledge + timeline: “Busy now—text you after 6.”",
      scenario:"You share something vulnerable; reply is “ok.”",
      discussion:[
        "What emotions do minimal replies spark?",
        "How could tiny reassurance shift impact?"
      ]
    }
  },
  {
    id:"ghostreplygabe", name:"GhostReplyGabe (M, 27)", tagline:"“Sorry, just saw this…”",
    img:"./images/ghostreplygabe.png",
    desc:"Gabe often ‘forgets’ to reply—especially when things get deep.",
    flags:{
      red:"Disconnects at depth; partners feel unimportant.",
      yellow:"Blames busyness for avoidance.",
      green:"Easygoing when engaged.",
      why:"Accountability builds trust; avoidance erodes it."
    },
    expanded:{
      attachment:"Avoidant — disengages to lower emotional intensity.",
      style:"Inconsistent responses; late-night replies.",
      conflict:"Disappears when conversations require vulnerability.",
      growth:"Name the pattern honestly; set tiny response goals.",
      repair:"Use autoresponses: “Saw this, will answer tomorrow.”",
      scenario:"‘Seen 3:42 pm’ — reply arrives 3:42 am.",
      discussion:[
        "Busy vs avoidant—how can you tell?",
        "What boundaries protect the other person here?"
      ]
    }
  },
  {
    id:"doubletexterdee", name:"DoubleTexterDee (F, 30)", tagline:"“Hello?? You there??”",
    img:"./images/doubletexterdee.png",
    desc:"Dee fires follow-ups fast when there’s no reply. Care looks like pressure.",
    flags:{
      red:"Stacks messages; ramps anxiety for both.",
      yellow:"Reads silence as danger.",
      green:"Persistent, engaged, responsive.",
      why:"Tolerance for uncertainty is a repair skill."
    },
    expanded:{
      attachment:"Anxious — seeks proximity through persistence.",
      style:"Multiple pings within minutes.",
      conflict:"Escalates when unsure; can trigger push-pull cycles.",
      growth:"Build ‘safe silence’ windows.",
      repair:"Agree on response expectations during busy hours.",
      scenario:"“hey” … “???” … “HELLOOOO” within an hour.",
      discussion:[
        "When is persistence caring vs. controlling?",
        "What resets help regulate the spiral?"
      ]
    }
  },
  {
    id:"capslockcarl", name:"CapsLockCarl (M, 38)", tagline:"“I’M NOT YELLING!!!”",
    img:"./images/capslockcarl.png",
    desc:"Carl types in ALL CAPS with !!! and ??? for emphasis—often reads as anger.",
    flags:{
      red:"Tone feels hostile even when he’s fine.",
      yellow:"Intensity over clarity.",
      green:"Direct, enthusiastic, no guessing games.",
      why:"Tone cues shape safety; modulation matters."
    },
    expanded:{
      attachment:"Mixed — intensity as a bid for attention.",
      style:"Caps + punctuation storms.",
      conflict:"Escalates with formatting instead of content.",
      growth:"Use emphasis sparingly; add feeling words.",
      repair:"Switch to normal case; state intent plainly.",
      scenario:"“WHERE R U??!!” after a late reply.",
      discussion:[
        "How do formatting cues change trust?",
        "What would a regulated version look like?"
      ]
    }
  }
];

const scenarios = [
  "Typing Bubbles: They type for 10 minutes… then nothing.",
  "Group Chat Ghost: They’re chatty in the group, quiet with you.",
  "Over-Emoji: You share something tender; the reply is 😂🔥👏.",
  "Missed Call Spiral: Three calls after you don’t answer once.",
  "Long Essay: You ask “how was your day?”; response is 900 words.",
  "Reply Roulette: Replies at 2am only, never daytime.",
  "Screenshot Surprise: They forward your chat to a friend for advice.",
  "Tone Police: “Don’t use periods, it sounds mad.”",
  "Voice Note Wall: Sends 3-min voice note instead of a yes/no.",
  "Read Receipt Rage: ‘Seen’ without reply triggers a fight.",
  "Location Leap: Shares live location without asking.",
  "Boundary Blur: Calls during work repeatedly despite reminders.",
  "Emoji Mismatch: Your grief gets a meme response.",
  "Caps Lock Clash: “WHY ARE YOU IGNORING ME??”",
  "Double Text Domino: Three follow-ups in 15 minutes."
];

/* ---------- Helpers ---------- */
function el(tag, props={}, children=[]) {
  const e = document.createElement(tag);
  Object.assign(e, props);
  if (props.className) e.setAttribute('class', props.className);
  (Array.isArray(children)?children:[children]).filter(Boolean).forEach(c=>{
    if (typeof c === 'string') e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  });
  return e;
}

function imgWithPlaceholder(src, alt){
  const box = el('div', {className:'imgbox'});
  const img = el('img', {alt});
  const ph  = el('div', {className:'ph'}, `${alt}`);
  img.addEventListener('load', () => { ph.classList.add('hide'); });
  img.addEventListener('error', () => {
    img.style.display = 'none';
    ph.textContent = `Missing image: ${src}`;
  });
  img.src = src;
  box.appendChild(img);
  box.appendChild(ph);
  return box;
}
function flagButton(label, cls, text){
  const btn = el('button', {className:`flag ${cls}`, title:label, onclick(){ alert(`${label}: ${text}`)}}, label);
  return btn;
}

/* ---------- Render Cards ---------- */
const grid = document.getElementById('grid');

profiles.forEach(p => {
  const card = el('article', {className:'card'});

  card.appendChild(imgWithPlaceholder(p.img, p.name));

  const c = el('div', {className:'content'});
  c.appendChild(el('div', {className:'name'}, p.name));
  c.appendChild(el('div', {className:'tag'}, p.tagline));
  c.appendChild(el('div', {className:'desc'}, p.desc));

  const flags = el('div', {className:'flags'});
  flags.appendChild(flagButton('🔴 Red', 'f-red', p.flags.red));
  flags.appendChild(flagButton('🟡 Yellow', 'f-yellow', p.flags.yellow));
  flags.appendChild(flagButton('🟢 Green', 'f-green', p.flags.green));
  flags.appendChild(flagButton('🔵 Why It Matters', 'f-blue', p.flags.why));
  c.appendChild(flags);

  const det = el('details');
  det.appendChild(el('summary', {}, 'Expanded Sections'));
  const meta = el('div', {className:'meta'});

  const rows = [
    ['Attachment Vibe', p.expanded.attachment],
    ['Communication Style', p.expanded.style],
    ['Conflict Habit', p.expanded.conflict],
    ['Growth Edge', p.expanded.growth],
    ['Ideal Repair', p.expanded.repair],
    ['Sample Scenario', p.expanded.scenario],
    ['Discussion', (p.expanded.discussion||[]).map((d,i)=>`${i+1}. ${d}`).join('\\n') || '—']
  ];
  rows.forEach(([label, text]) => {
    const row = el('div', {className:'row'});
    row.appendChild(el('b', {}, label));
    row.appendChild(el('p', {}, text));
    meta.appendChild(row);
  });
  det.appendChild(meta);
  c.appendChild(det);

  card.appendChild(c);
  grid.appendChild(card);
});

/* ---------- Scenario Bank ---------- */
const chips = document.getElementById('chips');
const drawer = document.getElementById('drawer');
const drawBtn = document.getElementById('draw');
const clearBtn = document.getElementById('clear');

function reveal(text){
  drawer.style.display='block';
  drawer.textContent = text;
}

scenarios.forEach(s => {
  const chip = el('button', {className:'chip', onclick(){ reveal(s) }}, s);
  chips.appendChild(chip);
});

drawBtn.addEventListener('click', () => {
  const s = scenarios[Math.floor(Math.random()*scenarios.length)];
  reveal(s);
});
clearBtn.addEventListener('click', () => {
  drawer.style.display='none';
  drawer.textContent='';
});
</script>
</body>
</html>
