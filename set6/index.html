<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vibe Check – Set 6 (Profiles 41–50)</title>
  <style>
    :root { --bg:#0f172a; --panel:#111827; --ink:#e5e7eb; --muted:#9ca3af; --accent:#38bdf8; --chip:#1f2937; --green:#10b981; --yellow:#f59e0b; --red:#ef4444; --card:#0b1220; --shadow:rgba(0,0,0,.45); --radius:16px; }
    *{ box-sizing: border-box; }
    html,body{ height:100%; }
    body{ margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Inter, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; background: radial-gradient(1200px 800px at 80% -10%, #0b1220 0%, var(--bg) 65%); color: var(--ink); }
    .wrap{ max-width:1100px; margin:0 auto; padding:24px; }
    header{ display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:20px; }
    .title{ font-weight:800; letter-spacing:.2px; line-height:1.1; }
    .title .kicker{ display:block; font-weight:600; font-size:12px; color:var(--muted); letter-spacing:1.4px; text-transform:uppercase; }
    .title .main{ font-size:clamp(22px,3.4vw,34px); }
    .controls{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
    button,.ghost{ background:linear-gradient(180deg,#1f2937,#0f172a); color:var(--ink); border:1px solid #263244; padding:10px 14px; border-radius:12px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; font-weight:600; box-shadow:0 6px 18px var(--shadow); transition: transform .06s ease, background .2s ease, border-color .2s ease; }
    button:hover{ transform:translateY(-1px); border-color:#334155; } button:active{ transform:translateY(0); }
    .ghost{ text-decoration:none; opacity:.85; }
    .grid{ display:grid; grid-template-columns:420px 1fr; gap:18px; } @media(max-width:980px){ .grid{grid-template-columns:1fr;} }
    .card{ background:linear-gradient(180deg,#0d1527,var(--card)); border:1px solid #1f2a3a; border-radius:var(--radius); overflow:hidden; box-shadow:0 20px 50px var(--shadow); }
    .imagebox{ position:relative; aspect-ratio:4/5; background:#0b1020; display:flex; align-items:center; justify-content:center; }
    .imagebox img{ width:100%; height:100%; object-fit:cover; }
    .badge{ position:absolute; left:12px; top:12px; background:#0f172a; border:1px solid #223048; padding:6px 10px; border-radius:999px; font-size:12px; color:var(--muted); }
    /* --- Added logo strip under the image --- */
    .logo-strip{ display:flex; align-items:center; justify-content:center; height:56px; background:linear-gradient(180deg,#0c1425,#0a1222); border-top:1px solid #1f2a3a; }
    .logo-strip img{ max-height:36px; width:auto; opacity:.92; }
    .panel{ padding:18px 18px 20px; }
    .handle{ font-size:22px; font-weight:800; } .meta{ color:var(--muted); font-size:14px; margin-top:2px; } .bio{ margin:12px 0 14px; color:#d1d5db; line-height:1.55; }
    .chips{ display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 14px; } .chip{ background:var(--chip); border:1px solid #243042; color:#cbd5e1; font-size:12px; padding:6px 10px; border-radius:999px; }
    .flags,.prompts,.interests{ background:#0c1425; border:1px solid #1a2536; padding:14px; border-radius:14px; }
    .section-title{ font-weight:700; font-size:13px; color:var(--muted); letter-spacing:.6px; text-transform:uppercase; margin-bottom:8px; }
    .flag-list,.prompt-list,.interest-list{ margin:0; padding-left:18px; }
    .flag-list li{ margin:6px 0; cursor:pointer; user-select:none; border-radius:10px; padding:4px 6px; transition: background .15s ease, transform .05s ease; }
    .flag-list li:hover{ transform: translateY(-1px); }
    .flag-green{ color:var(--green); } .flag-yellow{ color:var(--yellow); } .flag-red{ color:var(--red); }
    .selected{ outline:2px solid #334155; background:#0f172a; }
    .voteBar{ display:flex; gap:10px; align-items:center; font-size:12px; color:var(--muted); margin-bottom:8px; }
    .dot{ width:10px; height:10px; border-radius:999px; display:inline-block; }
    .g{ background:var(--green); } .y{ background:var(--yellow);} .r{ background:var(--red);} 
    .stack{ display:grid; gap:12px; }
    footer{ margin-top:18px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; color:var(--muted); font-size:12px; }
    .kbd{ background:#0b1424; border:1px solid #1a2638; padding:2px 6px; border-radius:6px; font-family: ui-monospace, Menlo, Monaco, Consolas, monospace; color:#cbd5e1; }
    .spacer{ flex:1 1 auto; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title">
        <span class="kicker">Vibe Check Game</span>
        <span class="main">Set 6 — Dating Profiles (41–50)</span>
      </div>
      <div class="controls">
        <button id="prevBtn" aria-label="Previous profile">◀ Prev</button>
        <button id="randomBtn" aria-label="Random profile">🔀 Random</button>
        <button id="nextBtn" aria-label="Next profile">Next ▶</button>
        <button id="toggleFlags">👁️ Toggle Flags</button>
        <button id="togglePrompts">🗣️ Toggle Prompts</button>
        <button id="resetVotes">♻️ Reset Votes</button>
        <button id="copySelected">📋 Copy Selected Flags</button>
        <a class="ghost" id="openImage" target="_blank" rel="noreferrer">Open Image</a>
      </div>
    </header>

    <main class="grid">
      <section class="card">
        <div class="imagebox">
          <img id="profileImg" alt="Profile image" />
          <div class="badge" id="badge">#41</div>
        </div>
        <!-- Logo strip (auto-hides if images/logo.png is missing) -->
        <div class="logo-strip" id="logoStrip">
          <img src="images/logo.png" alt="Vibe Check logo" onerror="this.parentElement.style.display='none';" />
        </div>
      </section>

      <section class="stack">
        <div class="card panel">
          <div class="handle" id="handle">AvoidantApril</div>
          <div class="meta" id="meta">F, 29</div>
          <p class="bio" id="bio"></p>
          <div class="chips" id="chips"></div>
          <div class="interests">
            <div class="section-title">Interests</div>
            <ul class="interest-list" id="interests"></ul>
          </div>
        </div>

        <div class="card panel" id="flagsWrap">
          <div class="flags">
            <div class="section-title">Flag Analysis</div>
            <div class="voteBar">
              <span><span class="dot g"></span> Green: <strong id="countGreen">0</strong></span>
              <span><span class="dot y"></span> Yellow: <strong id="countYellow">0</strong></span>
              <span><span class="dot r"></span> Red: <strong id="countRed">0</strong></span>
            </div>
            <ul class="flag-list" id="flags"></ul>
          </div>
        </div>

        <div class="card panel" id="promptsWrap">
          <div class="prompts">
            <div class="section-title">Reflection Prompts</div>
            <ul class="prompt-list" id="prompts"></ul>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div>Tips: Click a flag to select/deselect. Use <span class="kbd">←</span>/<span class="kbd">→</span> arrows to navigate profiles.</div>
      <div class="spacer"></div>
      <div id="counter">1 / 10</div>
    </footer>
  </div>

  <script>
    var PROFILES = [
      { id:41, handle:"AvoidantApril", gender:"F", age:29,
        bio:"I’ll listen to your story, your goals, your dreams—and then vanish when you try to hear mine. I'm not cold, I just never learned how to stay.",
        interests:["Long walks alone","“I’m just tired” texts","solo playlists","letting things fade"],
        flags:{
          green:["Thoughtful","independent","self-aware"],
          yellow:["May struggle with reciprocal vulnerability"],
          red:["Avoids intimacy by withholding her own presence"]
        },
        prompts:[
          "When does space turn into emotional unavailability?",
          "Can someone be there for you without being truly present?",
          "What does safe closeness feel like?"
        ],
        image:"images/avoidantapril.png"
      },
      { id:42, handle:"IntensityIvan", gender:"M", age:34,
        bio:"When I fall, I fall hard. First date? I’m talking soulmates. I text back fast and love even faster. You won’t have to guess—until I burn out.",
        interests:["Love bombing memes","passionate declarations","relationship TikToks","emotional rollercoasters"],
        flags:{
          green:["Expressive","emotionally available","devoted"],
          yellow:["May rush emotional timelines"],
          red:["May use intensity to bypass slow emotional safety"]
        },
        prompts:[
          "How does speed impact emotional security?",
          "Can intensity mask insecurity?",
          "What does sustainable connection look like?"
        ],
        image:"images/intensityivan.png"
      },
      { id:43, handle:"ProjectionPauline", gender:"F", age:31,
        bio:"If I feel it, it must be true. If I think you’re mad, you probably are. I trust my gut—especially when it’s wrong.",
        interests:["Overanalyzing texts","assuming the worst","making meaning from silence","reading into tone"],
        flags:{
          green:["Emotionally intuitive","empathic","tuned-in"],
          yellow:["May confuse feelings with facts"],
          red:["May assign motives and react to imagined slights"]
        },
        prompts:[
          "What’s the line between intuition and assumption?",
          "How do we check our stories before we believe them?",
          "Can emotions guide us without hijacking us?"
        ],
        image:"images/projectionpauline.png"
      },
      { id:44, handle:"SelfImprovementSam", gender:"M", age:32,
        bio:"I’m always growing—reading, reflecting, healing. I’ve done six shadow work journals and three trauma retreats. Now I just need a partner who’s as “evolved” as me.",
        interests:["Self-help books","nervous system charts","“growth mindset” quotes","therapeutic language"],
        flags:{
          green:["Growth-focused","insightful","emotionally engaged"],
          yellow:["May be judgmental toward others’ progress"],
          red:["May weaponize healing language to avoid real accountability"]
        },
        prompts:[
          "When does growth become performance?",
          "Can we be “further along” and still be humble?",
          "What does shared growth look like in relationship?"
        ],
        image:"images/selfimprovementsam.png"
      },
      { id:45, handle:"ImNotLikeMyExEmily", gender:"F", age:33,
        bio:"You’ll hear about my ex—often. I’ll reassure you that I’m nothing like your last partner… or mine. I want to be the opposite of what hurt you.",
        interests:["Comparing notes","seeking reassurance","overcorrecting behaviors","boundary-smoothing"],
        flags:{
          green:["Empathetic","aware of relational wounds","emotionally invested"],
          yellow:["May blur identity by focusing on past comparisons"],
          red:["May define herself by contrast rather than authenticity"]
        },
        prompts:[
          "What does it mean to be yourself—not someone else’s antidote?",
          "When does empathy become self-erasure?",
          "Can love thrive when defined by what it isn’t?"
        ],
        image:"images/imnotlikemyexemily.png"
      },
      { id:46, handle:"SecretSoftieSean", gender:"M", age:35,
        bio:"Tough on the outside, teddy bear on the inside—just don’t tell anyone. I’ve got a soft heart under all this sarcasm, but vulnerability still feels risky.",
        interests:["Deadpan humor","surprise compliments","soft music playlists he denies liking","quietly remembering your favorite snack"],
        flags:{
          green:["Loyal","protective","deeply caring"],
          yellow:["May hide sensitivity behind deflection"],
          red:["May struggle to express vulnerability directly"]
        },
        prompts:[
          "How do we spot tenderness in unexpected places?",
          "Can someone protect you without protecting from you?",
          "What does safe emotional expression look like for someone guarded?"
        ],
        image:"images/secretsoftiesean.png"
      },
      { id:47, handle:"BusyButBoredBri", gender:"F", age:30,
        bio:"I’m booked, busy, and burned out. My schedule is full—but something still feels missing. I date to feel alive again, but flake when I get overwhelmed.",
        interests:["Color-coded calendars","3-minute meditations","ghosting out of guilt","binge-watching to escape burnout"],
        flags:{
          green:["Ambitious","productive","motivated"],
          yellow:["May overcommit and underconnect"],
          red:["Uses busyness to avoid addressing emotional emptiness"]
        },
        prompts:[
          "What’s the emotional cost of constant productivity?",
          "Can presence coexist with a packed schedule?",
          "When does “too busy” become a defense?"
        ],
        image:"images/busybutboredbri.png"
      },
      { id:48, handle:"ContrarianCarl", gender:"M", age:37,
        bio:"If you say yes, I say no—just to keep things interesting. I’m not trying to argue, I just don’t trust easy agreement. Challenge me, or I’ll challenge you.",
        interests:["Devil’s advocate debates","unpopular opinions","being the “realist” in every room"],
        flags:{
          green:["Critical thinker","confident","intellectually honest"],
          yellow:["May confuse connection with conflict"],
          red:["May create tension to feel in control"]
        },
        prompts:[
          "When does healthy debate become emotional distance?",
          "Can connection happen without conflict?",
          "What’s behind the need to always be right?"
        ],
        image:"images/contrariancarl.png"
      },
      { id:49, handle:"VulnerabilityCoachVal", gender:"F", age:34,
        bio:"I’ll coach you through your emotional breakthroughs—but don’t ask about mine. I’ve got insight for days, but letting you close is another story.",
        interests:["Podcast guesting","deep dives","intellectualizing intimacy","guiding others through feelings she avoids"],
        flags:{
          green:["Wise","emotionally intelligent","reflective"],
          yellow:["Keeps relationships one-sided emotionally"],
          red:["May use insight to deflect personal vulnerability"]
        },
        prompts:[
          "Can we teach what we haven’t truly practiced?",
          "How does helping others sometimes shield our own hearts?",
          "What would happen if the coach took off the armor?"
        ],
        image:"images/vulnerabilitycoachval.png"
      },
      { id:50, handle:"DramaFreeDerek", gender:"M", age:36,
        bio:"No drama. No games. No “extra.” I’m clear on what I want—but sometimes forget relationships come with actual emotions. If you cry, I might hand you a napkin and silently panic.",
        interests:["Routine","logic","emotionally-neutral hobbies","saying “I’m just a simple guy”"],
        flags:{
          green:["Stable","direct","grounded"],
          yellow:["May undervalue emotional nuance"],
          red:["May withdraw or shut down in response to emotional complexity"]
        },
        prompts:[
          "When does emotional stability become emotional avoidance?",
          "Can someone be “drama-free” without being emotionally disengaged?",
          "How do we teach comfort with feelings to those who fear them?"
        ],
        image:"images/dramafreederek.png"
      }
    ];

    var index = 0;
    var imgEl = document.getElementById('profileImg');
    var badgeEl = document.getElementById('badge');
    var handleEl = document.getElementById('handle');
    var metaEl = document.getElementById('meta');
    var bioEl = document.getElementById('bio');
    var chipsEl = document.getElementById('chips');
    var interestsEl = document.getElementById('interests');
    var flagsEl = document.getElementById('flags');
    var promptsEl = document.getElementById('prompts');
    var counterEl = document.getElementById('counter');
    var openImageEl = document.getElementById('openImage');
    var flagsWrap = document.getElementById('flagsWrap');
    var promptsWrap = document.getElementById('promptsWrap');
    var countGreen = document.getElementById('countGreen');
    var countYellow = document.getElementById('countYellow');
    var countRed = document.getElementById('countRed');

    var VOTES = {};

    function getVoteSet(id){
      if (!VOTES[id]) VOTES[id] = {};
      return VOTES[id];
    }

    function updateCounts() {
      var set = getVoteSet(PROFILES[index].id);
      var g=0,y=0,r=0;
      for (var key in set) {
        if (!set[key]) continue;
        if (key.indexOf('g-')===0) g++;
        else if (key.indexOf('y-')===0) y++;
        else if (key.indexOf('r-')===0) r++;
      }
      countGreen.textContent = g; countYellow.textContent = y; countRed.textContent = r;
    }

    function render(i) {
      var p = PROFILES[i]; if (!p) return; index = i;
      imgEl.src = p.image; imgEl.alt = p.handle + ' image'; openImageEl.href = p.image;
      badgeEl.textContent = '#' + p.id; handleEl.textContent = p.handle; metaEl.textContent = p.gender + ', ' + p.age; bioEl.textContent = p.bio;
      chipsEl.innerHTML=''; [['Green','var(--green)'],['Yellow','var(--yellow)'],['Red','var(--red)']].forEach(function(pair){ var label=pair[0], color=pair[1]; var s=document.createElement('span'); s.className='chip'; s.style.borderColor=color; s.textContent=label+' Flags'; chipsEl.appendChild(s); });
      var ints = p.interests ? p.interests : []; interestsEl.innerHTML = ints.map(function(x){return '<li>'+x+'</li>';}).join('');
      flagsEl.innerHTML='';
      var current = getVoteSet(p.id);
      function makeLi(text,color,idx){
        var li=document.createElement('li');
        li.textContent=(color==='g'?'✅ Green Flag: ':(color==='y'?'⚠️ Yellow Flag: ':'🚩 Red Flag: '))+text;
        li.className=color==='g'?'flag-green':(color==='y'?'flag-yellow':'flag-red');
        var key=color+'-'+idx; if(current[key]) li.classList.add('selected');
        li.addEventListener('click',function(){ if(li.classList.contains('selected')){ li.classList.remove('selected'); current[key]=false;} else { li.classList.add('selected'); current[key]=true;} updateCounts(); });
        return li;
      }
      var g = (p.flags && p.flags.green) ? p.flags.green : [];
      var y = (p.flags && p.flags.yellow) ? p.flags.yellow : [];
      var r = (p.flags && p.flags.red) ? p.flags.red : [];
      g.forEach(function(t,i){ flagsEl.appendChild(makeLi(t,'g',i)); });
      y.forEach(function(t,i){ flagsEl.appendChild(makeLi(t,'y',i)); });
      r.forEach(function(t,i){ flagsEl.appendChild(makeLi(t,'r',i)); });
      var pr = p.prompts ? p.prompts : [];
      promptsEl.innerHTML=pr.map(function(x){return '<li>'+x+'</li>';}).join('');
      counterEl.textContent=(i+1)+' / '+PROFILES.length; updateCounts();
    }

    document.getElementById('prevBtn').addEventListener('click',function(){ render((index-1+PROFILES.length)%PROFILES.length); });
    document.getElementById('nextBtn').addEventListener('click',function(){ render((index+1)%PROFILES.length); });
    document.getElementById('randomBtn').addEventListener('click',function(){ render(Math.floor(Math.random()*PROFILES.length)); });
    document.getElementById('toggleFlags').addEventListener('click',function(){ flagsWrap.style.display=(flagsWrap.style.display==='none')?'':'none'; });
    document.getElementById('togglePrompts').addEventListener('click',function(){ promptsWrap.style.display=(promptsWrap.style.display==='none')?'':'none'; });
    document.getElementById('resetVotes').addEventListener('click',function(){ delete VOTES[PROFILES[index].id]; render(index); });
    document.getElementById('copySelected').addEventListener('click', function(){
      var p=PROFILES[index];
      var items=[]; var lis=flagsEl.querySelectorAll('li');
      for (var i=0;i<lis.length;i++){ if(lis[i].classList.contains('selected')) items.push('- '+lis[i].textContent); }
      var text='Selected Flags — '+p.handle+' (Set 6)\n\n'+(items.join('\n')||'(none selected)');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function(){
          var btn=document.getElementById('copySelected'); btn.textContent='✅ Copied!'; setTimeout(function(){ btn.textContent='📋 Copy Selected Flags'; },1200);
        }).catch(function(){ alert('Could not copy to clipboard.'); });
      } else {
        alert('Copy not supported in this browser.');
      }
    });

    window.addEventListener('keydown', function(e){ if(e.key==='ArrowLeft') render((index-1+PROFILES.length)%PROFILES.length); if(e.key==='ArrowRight') render((index+1)%PROFILES.length); if((e.key||'').toLowerCase()==='r') render(Math.floor(Math.random()*PROFILES.length)); });

    render(0);
  </script>
</body>
</html>
